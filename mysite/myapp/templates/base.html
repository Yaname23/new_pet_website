
<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сегодня новый день!</title>
     <link rel="stylesheet" href="{% static 'css/style.css' %}"><!--     <style>-->


</head>
<body>
    <div class="body">
    <header>
        <div class="container">
            <nav class="navbar">
              <div class="nav-left">
                <a href="/">Главная</a>
              </div>

              <!-- Правая часть -->
              <div class="nav-right">
                <a href="/about" class="push-right">о проекте</a>
                <a href="/lk" class="rg">ЛК</a>
              </div>

            </nav>
        </div>
    </header>

    <div class="container content">
        {% block content %}
        {% endblock %}
    </div>
 </div>

<footer class="footer">

        <br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/>
        <div>
            <h3>Спасибо за то, что посетили мой сайт! </h3>
        </div>
        <div>
            <p>Текущее время: <time id="currentTime"></time></p>

            <script>
              var timeElement = document.getElementById('currentTime');
              setInterval(function () {
                var currentTime = new Date();
                timeElement.textContent = currentTime.toLocaleTimeString();
              }, 1000);
            </script>
        </div>

</footer>
</body>
</html>
